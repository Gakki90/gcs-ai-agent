name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create test env file
        shell: pwsh
        run: |
          @"
          BIGMODEL_API_KEY=your_test_key_here
          AUTOGLM_BASE_URL=https://open.bigmodel.cn/api/paas/v4
          AUTOGLM_MODEL=autoglm-phone
          "@ | Set-Content -Encoding UTF8 .env

      - name: Download Android platform-tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Force "platform-tools.zip" -DestinationPath "vendor"
          if (Test-Path "vendor/platform-tools") {
            Write-Host "platform-tools ready"
          } else {
            throw "platform-tools download failed"
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Install Open-AutoGLM
        shell: pwsh
        run: |
          git clone https://github.com/zai-org/Open-AutoGLM.git ..\Open-AutoGLM
          Push-Location ..\Open-AutoGLM
          python -m pip install -r requirements.txt
          python -m pip install -e .
          Pop-Location

      - name: Build Vue frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location

      - name: Build Python backend executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --name autoglm-backend --onefile --collect-all phone_agent --add-data "apk/ADBKeyboard.apk;apk" backend_entry.py

      - name: Install Electron dependencies
        shell: pwsh
        run: npm install

      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoGLM-Phone-Cluster-Windows-Installer
          path: release/*.exe
